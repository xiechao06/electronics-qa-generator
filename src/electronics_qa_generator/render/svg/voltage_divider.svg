<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <style>
    text { font-family: sans-serif; font-size: 16px; fill: black; }
    .label { font-size: 14px; }
    .node { font-size: 12px; fill: #333; }
    .wire { stroke: black; stroke-width: 2; fill: none; }
    .sym { stroke: black; stroke-width: 2; fill: none; }
    .sym-filled { stroke: black; stroke-width: 2; fill: white; }
  </style>

  <!-- Background -->
  <rect width="800" height="400" fill="white"/>

  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-size="18" font-weight="bold">Voltage Divider</text>

  <!-- Wires: top rail -->
  <line class="wire" x1="180" y1="120" x2="340" y2="120"/>
  <line class="wire" x1="420" y1="120" x2="580" y2="120"/>
  <!-- Wires: bottom rail -->
  <line class="wire" x1="180" y1="280" x2="580" y2="280"/>
  <!-- Vertical wire from Vin+ to top rail (stops at circle top) -->
  <line class="wire" x1="180" y1="120" x2="180" y2="170"/>

  <!-- Voltage source Vin (vertical) -->
  <circle class="sym-filled" cx="180" cy="190" r="20"/>
  <!-- + and - -->
  <line class="wire" x1="180" y1="170" x2="180" y2="175"/>
  <line class="wire" x1="180" y1="205" x2="180" y2="210"/>
  <line class="wire" x1="174" y1="172" x2="186" y2="178"/>
  <line class="wire" x1="174" y1="208" x2="186" y2="202"/>
  <line class="wire" x1="174" y1="178" x2="186" y2="172"/>
  <line class="wire" x1="174" y1="202" x2="186" y2="208"/>
  <!-- Source label -->
  <text id="slot-Vin" class="label" x="195" y="192" text-anchor="start">V1 ??V DC</text>

  <!-- R1 (zigzag resistor, horizontal on top rail) -->
  <!-- Leads -->
  <line class="wire" x1="340" y1="120" x2="355" y2="120"/>
  <line class="wire" x1="405" y1="120" x2="420" y2="120"/>
  <!-- Zigzag: 3.5 segments of 10px each -->
  <polyline class="wire" points="355,120 362,110 376,130 390,110 405,120"/>
  <text id="slot-R1" class="label" x="380" y="105" text-anchor="middle">R1 4.7kΩ</text>

  <!-- R2 (zigzag resistor, vertical dropping to bottom rail) -->
  <!-- Top lead -->
  <line class="wire" x1="580" y1="120" x2="580" y2="145"/>
  <!-- Zigzag vertical -->
  <polyline class="wire" points="580,145 565,160 595,180 565,200 595,220 580,235"/>
  <!-- Bottom lead -->
  <line class="wire" x1="580" y1="235" x2="580" y2="280"/>
  <text id="slot-R2" class="label" x="598" y="190" text-anchor="start">R2 10kΩ</text>

  <!-- Ground symbol (wire connects from circle bottom) -->
  <line class="wire" x1="180" y1="210" x2="180" y2="280"/>
  <line class="wire" x1="150" y1="280" x2="210" y2="280"/>
  <line class="wire" x1="158" y1="288" x2="202" y2="288"/>
  <line class="wire" x1="166" y1="296" x2="194" y2="296"/>

  <!-- Node labels -->
  <text id="slot-node-in" class="node" x="140" y="125" text-anchor="end">in</text>
  <text id="slot-node-out" class="node" x="500" y="115" text-anchor="middle">out</text>
  <!-- Node 0 is ground — shown as GND symbol above -->
</svg>
