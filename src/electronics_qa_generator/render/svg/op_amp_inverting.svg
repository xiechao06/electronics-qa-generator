<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <style>
    text { font-family: sans-serif; font-size: 16px; fill: black; }
    .label { font-size: 14px; }
    .node { font-size: 12px; fill: #333; }
    .wire { stroke: black; stroke-width: 2; fill: none; }
    .sym { stroke: black; stroke-width: 2; fill: none; }
    .sym-filled { stroke: black; stroke-width: 2; fill: white; }
    .thin { stroke: black; stroke-width: 1; fill: none; }
  </style>

  <rect width="800" height="400" fill="white"/>
  <text x="400" y="30" text-anchor="middle" font-size="18" font-weight="bold">Op-Amp Inverting Amplifier</text>

  <!-- Ground rail -->
  <line class="wire" x1="60" y1="340" x2="640" y2="340"/>
  <!-- Ground symbol -->
  <line class="wire" x1="120" y1="340" x2="120" y2="346"/>
  <line class="wire" x1="100" y1="346" x2="140" y2="346"/>
  <line class="wire" x1="108" y1="352" x2="132" y2="352"/>
  <line class="wire" x1="116" y1="358" x2="124" y2="358"/>

  <!-- +VCC supply source (far left) -->
  <circle class="sym-filled" cx="80" cy="120" r="16"/>
  <line class="thin" x1="75" y1="110" x2="85" y2="110"/>
  <line class="thin" x1="80" y1="105" x2="80" y2="115"/>
  <line class="thin" x1="75" y1="130" x2="85" y2="130"/>
  <line class="wire" x1="80" y1="104" x2="80" y2="80"/>
  <line class="wire" x1="80" y1="136" x2="80" y2="340"/>
  <text id="slot-VCC" class="label" x="80" y="74" text-anchor="middle">VCC V</text>

  <!-- -VEE supply source (far left) -->
  <circle class="sym-filled" cx="175" cy="120" r="16"/>
  <line class="thin" x1="170" y1="110" x2="180" y2="110"/>
  <line class="thin" x1="170" y1="130" x2="180" y2="130"/>
  <line class="thin" x1="175" y1="125" x2="175" y2="135"/>
  <line class="wire" x1="175" y1="104" x2="175" y2="80"/>
  <line class="wire" x1="175" y1="136" x2="175" y2="340"/>
  <text id="slot-VEE" class="label" x="175" y="74" text-anchor="middle">VEE V</text>

  <!-- Vin signal source -->
  <circle class="sym-filled" cx="230" cy="270" r="18"/>
  <line class="thin" x1="224" y1="260" x2="236" y2="260"/>
  <line class="thin" x1="230" y1="254" x2="230" y2="266"/>
  <line class="thin" x1="224" y1="280" x2="236" y2="280"/>
  <line class="wire" x1="230" y1="252" x2="230" y2="160"/>
  <line class="wire" x1="230" y1="288" x2="230" y2="340"/>
  <text id="slot-Vin" class="label" x="252" y="274" text-anchor="start">Vin V</text>
  <text id="slot-node-in" class="node" x="214" y="152" text-anchor="end">in</text>

  <!-- Rin (in -> inverting input) -->
  <line class="wire" x1="230" y1="160" x2="285" y2="160"/>
  <polyline class="wire" points="285,160 291,150 303,170 315,150 327,170 333,160"/>
  <line class="wire" x1="333" y1="160" x2="380" y2="160"/>
  <text id="slot-Rin" class="label" x="309" y="143" text-anchor="middle">Rin 1kΩ</text>

  <!-- Inverting-input node (vertical) -->
  <line class="wire" x1="380" y1="120" x2="380" y2="185"/>
  <line class="wire" x1="380" y1="185" x2="420" y2="185"/>

  <!-- Rf (output -> inverting input, feedback) -->
  <line class="wire" x1="380" y1="120" x2="440" y2="120"/>
  <polyline class="wire" points="440,120 446,110 458,130 470,110 482,130 488,120"/>
  <line class="wire" x1="488" y1="120" x2="560" y2="120"/>
  <text id="slot-Rf" class="label" x="464" y="103" text-anchor="middle">Rf 10kΩ</text>

  <!-- Cpole (feedback capacitor, parallel with Rf) -->
  <line class="wire" x1="380" y1="120" x2="380" y2="90"/>
  <line class="wire" x1="380" y1="90" x2="458" y2="90"/>
  <line class="wire" x1="458" y1="78" x2="458" y2="102"/>
  <line class="wire" x1="466" y1="78" x2="466" y2="102"/>
  <line class="wire" x1="466" y1="90" x2="560" y2="90"/>
  <line class="wire" x1="560" y1="90" x2="560" y2="120"/>
  <text id="slot-Cpole" class="label" x="462" y="70" text-anchor="middle" font-size="12">Cpole</text>

  <!-- Non-inverting input to ground (via Rgnd) -->
  <line class="wire" x1="420" y1="215" x2="365" y2="215"/>
  <line class="wire" x1="365" y1="215" x2="365" y2="245"/>
  <polyline class="wire" points="365,245 355,251 375,263 355,275 375,287 365,293"/>
  <line class="wire" x1="365" y1="293" x2="365" y2="340"/>
  <text id="slot-Rgnd" class="label" x="383" y="252" text-anchor="start">Rgnd</text>

  <!-- Op-amp triangle -->
  <polygon class="sym-filled" points="420,160 420,240 520,200"/>
  <text x="434" y="191" text-anchor="middle" font-size="16">&#8722;</text>
  <text x="434" y="224" text-anchor="middle" font-size="14">+</text>

  <!-- Output -->
  <line class="wire" x1="520" y1="200" x2="640" y2="200"/>
  <line class="wire" x1="560" y1="200" x2="560" y2="120"/>
  <text id="slot-node-out" class="node" x="600" y="190" text-anchor="start">out</text>
</svg>
