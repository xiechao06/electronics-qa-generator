<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <style>
    text { font-family: sans-serif; font-size: 16px; fill: black; }
    .label { font-size: 14px; }
    .node { font-size: 12px; fill: #333; }
    .wire { stroke: black; stroke-width: 2; fill: none; }
    .sym { stroke: black; stroke-width: 2; fill: none; }
    .sym-filled { stroke: black; stroke-width: 2; fill: white; }
  </style>

  <rect width="800" height="400" fill="white"/>
  <text x="400" y="30" text-anchor="middle" font-size="18" font-weight="bold">Op-Amp Inverting Amplifier</text>

  <!-- Top rail (+VCC) -->
  <line class="wire" x1="300" y1="80" x2="500" y2="80"/>
  <line class="wire" x1="180" y1="80" x2="300" y2="80"/>
  <circle class="sym-filled" cx="160" cy="80" r="12"/>
  <line class="wire" x1="148" y1="80" x2="153" y2="80"/>
  <line class="wire" x1="167" y1="80" x2="172" y2="80"/>
  <line class="wire" x1="156" y1="76" x2="164" y2="84"/>
  <line class="wire" x1="156" y1="84" x2="164" y2="76"/>
  <text id="slot-VCC" class="label" x="135" y="73" text-anchor="end">VCC V</text>

  <!-- Bottom rail (-VEE) -->
  <line class="wire" x1="300" y1="320" x2="500" y2="320"/>
  <line class="wire" x1="180" y1="320" x2="300" y2="320"/>
  <circle class="sym-filled" cx="160" cy="320" r="12"/>
  <line class="wire" x1="148" y1="320" x2="153" y2="320"/>
  <line class="wire" x1="167" y1="320" x2="172" y2="320"/>
  <line class="wire" x1="156" y1="316" x2="164" y2="324"/>
  <line class="wire" x1="156" y1="324" x2="164" y2="316"/>
  <text id="slot-VEE" class="label" x="135" y="327" text-anchor="end">VEE V</text>

  <!-- Ground -->
  <line class="wire" x1="160" y1="350" x2="160" y2="340"/>
  <line class="wire" x1="140" y1="350" x2="180" y2="350"/>
  <line class="wire" x1="145" y1="356" x2="175" y2="356"/>
  <line class="wire" x1="150" y1="362" x2="170" y2="362"/>

  <!-- Vin -->
  <circle class="sym-filled" cx="160" cy="180" r="12"/>
  <line class="wire" x1="148" y1="180" x2="153" y2="180"/>
  <line class="wire" x1="167" y1="180" x2="172" y2="180"/>
  <line class="wire" x1="156" y1="176" x2="164" y2="184"/>
  <line class="wire" x1="156" y1="184" x2="164" y2="176"/>
  <text id="slot-Vin" class="label" x="135" y="173" text-anchor="end">Vin V</text>

  <!-- Rin (horizontal) -->
  <line class="wire" x1="180" y1="180" x2="200" y2="180"/>
  <polyline class="wire" points="200,180 210,170 220,190 230,170 240,190 250,180"/>
  <line class="wire" x1="250" y1="180" x2="300" y2="180"/>
  <text id="slot-Rin" class="label" x="225" y="165" text-anchor="middle">Rin 1kΩ</text>

  <!-- Op-amp triangle -->
  <polygon class="sym" points="300,130 300,230 400,180"/>
  <!-- + and - inputs -->
  <line class="wire" x1="310" y1="170" x2="310" y2="175"/>
  <line class="wire" x1="310" y1="190" x2="310" y2="195"/>
  <line class="wire" x1="306" y1="172" x2="314" y2="178"/>
  <line class="wire" x1="306" y1="178" x2="314" y2="172"/>
  <line class="wire" x1="306" y1="192" x2="314" y2="186"/>
  <!-- Non-inverting to ground -->
  <line class="wire" x1="300" y1="160" x2="270" y2="160"/>
  <line class="wire" x1="270" y1="160" x2="270" y2="350"/>
  <text class="label" x="310" y="215" text-anchor="start" font-size="12">−</text>
  <text class="label" x="310" y="145" text-anchor="start" font-size="12">+</text>

  <!-- Output -->
  <line class="wire" x1="400" y1="180" x2="480" y2="180"/>
  <text id="slot-node-out" class="node" x="500" y="175" text-anchor="start">out</text>

  <!-- Rf (from output back to inverting input) -->
  <line class="wire" x1="450" y1="180" x2="450" y2="100"/>
  <line class="wire" x1="340" y1="100" x2="450" y2="100"/>
  <polyline class="wire" points="340,100 330,110 340,120 350,110 360,120 370,110 380,120 390,110"/>
  <line class="wire" x1="300" y1="180" x2="300" y2="130"/>
  <line class="wire" x1="300" y1="130" x2="300" y2="100"/>
  <text id="slot-Rf" class="label" x="380" y="95" text-anchor="middle">Rf 10kΩ</text>

  <text id="slot-node-in" class="node" x="185" y="175" text-anchor="start">in</text>
</svg>
