<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <style>
    text { font-family: sans-serif; font-size: 16px; fill: black; }
    .label { font-size: 14px; }
    .node { font-size: 12px; fill: #333; }
    .wire { stroke: black; stroke-width: 2; fill: none; }
    .sym { stroke: black; stroke-width: 2; fill: none; }
    .sym-filled { stroke: black; stroke-width: 2; fill: white; }
    .thin { stroke: black; stroke-width: 1; fill: none; }
  </style>

  <rect width="800" height="400" fill="white"/>
  <text x="400" y="30" text-anchor="middle" font-size="18" font-weight="bold">MOSFET Common-Source Amplifier</text>

  <!-- VDD rail -->
  <line class="wire" x1="90" y1="70" x2="450" y2="70"/>
  <!-- Ground rail -->
  <line class="wire" x1="60" y1="360" x2="640" y2="360"/>
  <!-- Ground symbol -->
  <line class="wire" x1="120" y1="360" x2="120" y2="366"/>
  <line class="wire" x1="100" y1="366" x2="140" y2="366"/>
  <line class="wire" x1="108" y1="372" x2="132" y2="372"/>
  <line class="wire" x1="116" y1="378" x2="124" y2="378"/>

  <!-- VDD supply source -->
  <circle class="sym-filled" cx="90" cy="150" r="16"/>
  <line class="thin" x1="85" y1="140" x2="95" y2="140"/>
  <line class="thin" x1="90" y1="135" x2="90" y2="145"/>
  <line class="thin" x1="85" y1="160" x2="95" y2="160"/>
  <line class="wire" x1="90" y1="134" x2="90" y2="70"/>
  <line class="wire" x1="90" y1="166" x2="90" y2="360"/>
  <text id="slot-VDD" class="label" x="68" y="153" text-anchor="end">VDD V</text>

  <!-- Vin AC source -->
  <circle class="sym-filled" cx="200" cy="320" r="18"/>
  <line class="thin" x1="194" y1="310" x2="206" y2="310"/>
  <line class="thin" x1="200" y1="304" x2="200" y2="316"/>
  <line class="thin" x1="194" y1="330" x2="206" y2="330"/>
  <line class="wire" x1="200" y1="302" x2="200" y2="210"/>
  <line class="wire" x1="200" y1="338" x2="200" y2="360"/>
  <text id="slot-Vin" class="label" x="222" y="324" text-anchor="start">Vin 1V AC</text>
  <text id="slot-node-in" class="node" x="220" y="202" text-anchor="middle">in</text>

  <!-- Cin coupling cap -->
  <line class="wire" x1="200" y1="210" x2="246" y2="210"/>
  <line class="wire" x1="246" y1="198" x2="246" y2="222"/>
  <line class="wire" x1="254" y1="198" x2="254" y2="222"/>
  <line class="wire" x1="254" y1="210" x2="340" y2="210"/>
  <text class="label" x="250" y="244" text-anchor="middle" font-size="12">Cin</text>

  <!-- Gate node + RG (gate -> ground) -->
  <line class="wire" x1="340" y1="210" x2="398" y2="210"/>
  <line class="wire" x1="340" y1="210" x2="340" y2="250"/>
  <polyline class="wire" points="340,250 330,256 350,268 330,280 350,292 340,298"/>
  <line class="wire" x1="340" y1="298" x2="340" y2="360"/>
  <text id="slot-RG" class="label" x="358" y="278" text-anchor="start">RG</text>

  <!-- NMOS symbol -->
  <!-- gate bar -->
  <line class="wire" x1="398" y1="188" x2="398" y2="232"/>
  <!-- channel bar -->
  <line class="wire" x1="412" y1="186" x2="412" y2="234"/>
  <!-- drain contact -->
  <line class="wire" x1="412" y1="196" x2="450" y2="196"/>
  <!-- source contact + arrow (NMOS, inward) -->
  <line class="wire" x1="412" y1="224" x2="450" y2="224"/>
  <polygon points="412,224 426,218 426,230" fill="black"/>
  <text id="slot-M1" class="label" x="372" y="248" text-anchor="end">M1</text>

  <!-- RD (VDD -> drain) -->
  <line class="wire" x1="450" y1="70" x2="450" y2="100"/>
  <polyline class="wire" points="450,100 440,106 460,118 440,130 460,142 450,148"/>
  <line class="wire" x1="450" y1="148" x2="450" y2="196"/>
  <text id="slot-RD" class="label" x="468" y="128" text-anchor="start">RD</text>

  <!-- RS (source -> ground) -->
  <line class="wire" x1="450" y1="224" x2="450" y2="282"/>
  <polyline class="wire" points="450,282 440,288 460,300 440,312 460,324 450,330"/>
  <line class="wire" x1="450" y1="330" x2="450" y2="360"/>
  <text id="slot-RS" class="label" x="468" y="310" text-anchor="start">RS</text>

  <!-- Drain node + Cout to output -->
  <line class="wire" x1="450" y1="172" x2="540" y2="172"/>
  <line class="wire" x1="540" y1="160" x2="540" y2="184"/>
  <line class="wire" x1="548" y1="160" x2="548" y2="184"/>
  <line class="wire" x1="548" y1="172" x2="640" y2="172"/>
  <text class="label" x="544" y="152" text-anchor="middle" font-size="12">Cout</text>
  <text id="slot-node-out" class="node" x="612" y="163" text-anchor="start">out</text>

  <!-- Rload (out -> ground) -->
  <line class="wire" x1="600" y1="172" x2="600" y2="206"/>
  <polyline class="wire" points="600,206 590,212 610,224 590,236 610,248 600,254"/>
  <line class="wire" x1="600" y1="254" x2="600" y2="360"/>
  <text id="slot-Rload" class="label" x="618" y="234" text-anchor="start">Rload</text>
</svg>
