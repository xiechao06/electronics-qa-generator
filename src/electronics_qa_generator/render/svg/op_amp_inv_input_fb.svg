<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <style>
    text { font-family: sans-serif; font-size: 16px; fill: black; }
    .label { font-size: 14px; }
    .node { font-size: 12px; fill: #333; }
    .wire { stroke: black; stroke-width: 2; fill: none; }
    .sym { stroke: black; stroke-width: 2; fill: none; }
    .sym-filled { stroke: black; stroke-width: 2; fill: white; }
  </style>

  <rect width="800" height="400" fill="white"/>
  <text x="400" y="28" text-anchor="middle" font-size="17" font-weight="bold">Op-Amp — Inverting with Input-Node Feedback</text>

  <!-- Ground rail -->
  <line class="wire" x1="60" y1="340" x2="720" y2="340"/>
  <line class="sym" x1="155" y1="340" x2="155" y2="346"/>
  <line class="sym" x1="138" y1="346" x2="172" y2="346"/>
  <line class="sym" x1="144" y1="352" x2="166" y2="352"/>
  <line class="sym" x1="150" y1="358" x2="160" y2="358"/>

  <!-- Vs source (left) -->
  <line class="wire" x1="100" y1="200" x2="100" y2="155"/>
  <circle class="sym-filled" cx="100" cy="175" r="20"/>
  <line class="sym" x1="94" y1="157" x2="106" y2="163"/>
  <line class="sym" x1="94" y1="163" x2="106" y2="157"/>
  <line class="sym" x1="94" y1="187" x2="106" y2="181"/>
  <line class="sym" x1="94" y1="181" x2="106" y2="187"/>
  <line class="wire" x1="100" y1="195" x2="100" y2="340"/>
  <text id="slot-Vs" class="label" x="60" y="176" text-anchor="end">Vs</text>

  <!-- R1: Vs → n1 (top horizontal) -->
  <line class="wire" x1="100" y1="155" x2="150" y2="155"/>
  <polyline class="sym" points="150,155 158,155 162,143 170,167 178,143 186,167 194,143 202,167 206,155 216,155"/>
  <text id="slot-R1" class="label" x="183" y="140" text-anchor="middle">R1</text>
  <!-- n1 node -->
  <line class="wire" x1="216" y1="155" x2="260" y2="155"/>
  <circle cx="260" cy="155" r="5" fill="black"/>
  <text x="260" y="143" text-anchor="middle" class="node">n1</text>
  <!-- in node (between Vs+ and R1) -->
  <circle cx="160" cy="155" r="4" fill="black"/>
  <text x="160" y="143" text-anchor="middle" class="node">in</text>

  <!-- R2: n1 → gnd (vertical) -->
  <line class="wire" x1="260" y1="155" x2="260" y2="185"/>
  <polyline class="sym" points="260,185 260,195 248,200 272,210 248,220 272,230 248,240 272,250 260,255 260,265"/>
  <text id="slot-R2" class="label" x="290" y="228" text-anchor="start">R2</text>
  <line class="wire" x1="260" y1="265" x2="260" y2="340"/>

  <!-- R3: n1 → inv (horizontal to op-amp – input) -->
  <line class="wire" x1="260" y1="155" x2="310" y2="155"/>
  <polyline class="sym" points="310,155 318,155 322,143 330,167 338,143 346,167 354,143 362,167 366,155 376,155"/>
  <text id="slot-R3" class="label" x="343" y="140" text-anchor="middle">R3</text>
  <line class="wire" x1="376" y1="155" x2="430" y2="155"/>
  <!-- inv node (–) -->
  <circle cx="430" cy="155" r="4" fill="black"/>
  <text x="420" y="148" text-anchor="middle" class="node">inv</text>

  <!-- Op-amp triangle -->
  <polygon class="sym-filled" points="450,120 450,200 530,160"/>
  <text x="447" y="148" text-anchor="end" font-size="14">−</text>
  <text x="447" y="183" text-anchor="end" font-size="14">+</text>
  <!-- (+) input to gnd -->
  <line class="wire" x1="450" y1="175" x2="400" y2="175"/>
  <line class="wire" x1="400" y1="175" x2="400" y2="340"/>
  <!-- (–) input wire -->
  <line class="wire" x1="430" y1="155" x2="450" y2="155"/>
  <!-- Output node -->
  <line class="wire" x1="530" y1="160" x2="620" y2="160"/>
  <circle cx="580" cy="160" r="5" fill="black"/>
  <text x="605" y="150" text-anchor="middle" class="node">out</text>
  <line class="wire" x1="620" y1="160" x2="620" y2="340"/>
  <!-- Vo label -->
  <text id="slot-Vs" class="label" x="635" y="255" text-anchor="start">V₀</text>
  <line class="sym" x1="625" y1="215" x2="625" y2="305"/>
  <text x="637" y="210" font-size="12" fill="#888">+</text>
  <text x="637" y="312" font-size="12" fill="#888">−</text>

  <!-- Rf2: out → inv (top feedback arc) -->
  <line class="wire" x1="580" y1="160" x2="580" y2="80"/>
  <line class="wire" x1="580" y1="80" x2="430" y2="80"/>
  <line class="wire" x1="430" y1="80" x2="430" y2="155"/>
  <!-- Rf2 resistor on top feedback wire -->
  <polyline class="sym" points="490,80 498,80 502,68 510,92 518,68 526,92 534,68 542,92 546,80 556,80"/>
  <text id="slot-Rf2" class="label" x="523" y="65" text-anchor="middle">Rf2</text>

  <!-- Rf1: out → n1 (diagonal feedback to input node) -->
  <line class="wire" x1="580" y1="160" x2="580" y2="50"/>
  <line class="wire" x1="580" y1="50" x2="260" y2="50"/>
  <line class="wire" x1="260" y1="50" x2="260" y2="155"/>
  <!-- Rf1 resistor on upper feedback wire -->
  <polyline class="sym" points="340,50 348,50 352,38 360,62 368,38 376,62 384,38 392,62 396,50 406,50"/>
  <text id="slot-Rf1" class="label" x="373" y="36" text-anchor="middle">Rf1</text>

  <!-- Source label for Vs (bottom reference) -->
  <text x="66" y="340" text-anchor="start" font-size="12" fill="#555">0V</text>
</svg>
