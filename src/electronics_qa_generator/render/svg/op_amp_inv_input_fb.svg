<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <style>
    text { font-family: sans-serif; font-size: 16px; fill: black; }
    .label { font-size: 14px; }
    .node { font-size: 12px; fill: #333; }
    .wire { stroke: black; stroke-width: 2; fill: none; }
    .sym { stroke: black; stroke-width: 2; fill: none; }
    .sym-filled { stroke: black; stroke-width: 2; fill: white; }
    .thin { stroke: black; stroke-width: 1; fill: none; }
  </style>

  <rect width="800" height="400" fill="white"/>
  <text x="400" y="30" text-anchor="middle" font-size="18" font-weight="bold">Op-Amp — Inverting with Input-Node Feedback</text>

  <!-- Ground rail -->
  <line class="wire" x1="60" y1="340" x2="700" y2="340"/>
  <!-- Ground symbol -->
  <line class="wire" x1="120" y1="340" x2="120" y2="346"/>
  <line class="wire" x1="102" y1="346" x2="138" y2="346"/>
  <line class="wire" x1="108" y1="353" x2="132" y2="353"/>
  <line class="wire" x1="114" y1="360" x2="126" y2="360"/>

  <!-- Vs source (left, vertical) -->
  <line class="wire" x1="120" y1="200" x2="120" y2="162"/>
  <circle class="sym-filled" cx="120" cy="182" r="20"/>
  <!-- + -->
  <line class="thin" x1="114" y1="172" x2="126" y2="172"/>
  <line class="thin" x1="120" y1="166" x2="120" y2="178"/>
  <!-- - -->
  <line class="thin" x1="114" y1="192" x2="126" y2="192"/>
  <line class="wire" x1="120" y1="202" x2="120" y2="340"/>
  <text id="slot-Vs" class="label" x="80" y="184" text-anchor="end">Vs</text>

  <!-- in node (top of Vs+) -->
  <circle cx="120" cy="200" r="4" fill="black"/>
  <text class="node" x="106" y="198" text-anchor="end">in</text>

  <!-- R1: in -> n1 (horizontal) -->
  <line class="wire" x1="120" y1="200" x2="165" y2="200"/>
  <polyline class="wire" points="165,200 172,188 186,212 200,188 214,212 228,188 242,200"/>
  <line class="wire" x1="242" y1="200" x2="290" y2="200"/>
  <text id="slot-R1" class="label" x="203" y="183" text-anchor="middle">R1</text>

  <!-- n1 node -->
  <circle cx="290" cy="200" r="5" fill="black"/>
  <text class="node" x="308" y="230" text-anchor="start">n1</text>

  <!-- R2: n1 -> gnd (vertical) -->
  <line class="wire" x1="290" y1="200" x2="290" y2="222"/>
  <polyline class="wire" points="290,222 278,230 302,244 278,258 302,272 278,286 290,294"/>
  <line class="wire" x1="290" y1="294" x2="290" y2="340"/>
  <text id="slot-R2" class="label" x="314" y="260" text-anchor="start">R2</text>

  <!-- R3: n1 -> inv input (horizontal) -->
  <line class="wire" x1="290" y1="200" x2="330" y2="200"/>
  <polyline class="wire" points="330,200 337,188 351,212 365,188 379,212 393,188 407,200"/>
  <line class="wire" x1="407" y1="200" x2="450" y2="200"/>
  <text id="slot-R3" class="label" x="368" y="183" text-anchor="middle">R3</text>

  <!-- inv node (vertical wire to op-amp minus) -->
  <circle cx="450" cy="200" r="4" fill="black"/>
  <line class="wire" x1="450" y1="200" x2="450" y2="185"/>
  <line class="wire" x1="450" y1="185" x2="490" y2="185"/>

  <!-- Rf2: output -> inv (top feedback, horizontal) -->
  <line class="wire" x1="450" y1="200" x2="450" y2="120"/>
  <line class="wire" x1="450" y1="120" x2="500" y2="120"/>
  <polyline class="wire" points="500,120 507,108 521,132 535,108 549,132 563,120"/>
  <line class="wire" x1="563" y1="120" x2="600" y2="120"/>
  <line class="wire" x1="600" y1="120" x2="600" y2="175"/>
  <text id="slot-Rf2" class="label" x="531" y="104" text-anchor="middle">Rf2</text>

  <!-- Rf1: output -> n1 (upper feedback, horizontal) -->
  <line class="wire" x1="600" y1="175" x2="600" y2="70"/>
  <line class="wire" x1="600" y1="70" x2="340" y2="70"/>
  <line class="wire" x1="340" y1="70" x2="290" y2="70"/>
  <line class="wire" x1="290" y1="70" x2="290" y2="200"/>
  <polyline class="wire" points="340,70 347,58 361,82 375,58 389,82 403,70"/>
  <text id="slot-Rf1" class="label" x="375" y="54" text-anchor="middle">Rf1</text>

  <!-- Op-amp triangle -->
  <polygon class="sym-filled" points="490,155 490,240 590,197"/>
  <text x="505" y="182" text-anchor="middle" font-size="16">&#8722;</text>
  <text x="505" y="225" text-anchor="middle" font-size="14">+</text>

  <!-- (+) input to ground -->
  <line class="wire" x1="490" y1="220" x2="450" y2="220"/>
  <line class="wire" x1="450" y1="220" x2="450" y2="340"/>

  <!-- Output wire -->
  <line class="wire" x1="590" y1="197" x2="700" y2="197"/>
  <circle cx="600" cy="197" r="5" fill="black"/>
  <line class="wire" x1="600" y1="197" x2="600" y2="120"/>
  <text class="node" x="655" y="188" text-anchor="start">out</text>

  <!-- Output to ground (right side) -->
  <line class="wire" x1="700" y1="197" x2="700" y2="340"/>

  <!-- Vo label (right side, clear of wires) -->
  <text class="label" x="726" y="223" text-anchor="start">+</text>
  <text class="label" x="724" y="272" text-anchor="start">V&#8320;</text>
  <text class="label" x="726" y="323" text-anchor="start">&#8722;</text>
</svg>
