<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420">
  <style>
    text { font-family: sans-serif; font-size: 16px; fill: black; }
    .label { font-size: 14px; }
    .node { font-size: 12px; fill: #333; }
    .wire { stroke: black; stroke-width: 2; fill: none; }
    .sym { stroke: black; stroke-width: 2; fill: none; }
    .sym-filled { stroke: black; stroke-width: 2; fill: white; }
  </style>

  <rect width="800" height="420" fill="white"/>
  <text x="400" y="30" text-anchor="middle" font-size="18" font-weight="bold">DC Multi-Source Series Mesh</text>

  <!-- Layout (single clockwise loop):
       Top-left:  V1 source  (aiding, + at top)
       Top rail:  n1 - R1 - a - R2 - nc
       Right side: V2 (opposing, + at nc)
       Right side: R3 (vertical)
       Bottom rail: ne - V3 - b - V4 - nf
       Left side: R4 (vertical, nf to gnd)
       Ground connects V1- and R4-bottom
  -->

  <!-- V1 source (left side, vertical) -->
  <line class="wire" x1="140" y1="100" x2="140" y2="148"/>
  <circle class="sym-filled" cx="140" cy="168" r="20"/>
  <!-- + top -->
  <line class="wire" x1="134" y1="150" x2="146" y2="156"/>
  <line class="wire" x1="134" y1="156" x2="146" y2="150"/>
  <!-- - bottom -->
  <line class="wire" x1="134" y1="180" x2="146" y2="174"/>
  <line class="wire" x1="134" y1="174" x2="146" y2="180"/>
  <line class="wire" x1="140" y1="188" x2="140" y2="320"/>
  <text id="slot-V1" class="label" x="88" y="170" text-anchor="end">V1</text>

  <!-- Top rail: n1 to right -->
  <line class="wire" x1="140" y1="100" x2="200" y2="100"/>

  <!-- R1 (horizontal, n1 to a) -->
  <line class="wire" x1="200" y1="100" x2="215" y2="100"/>
  <polyline class="wire" points="215,100 222,88 236,112 250,88 264,112 278,88 292,100"/>
  <line class="wire" x1="292" y1="100" x2="330" y2="100"/>
  <text id="slot-R1" class="label" x="253" y="82" text-anchor="middle">R1</text>

  <!-- Terminal a (node dot + labels) -->
  <circle cx="330" cy="100" r="5" fill="black"/>
  <text x="330" y="75" text-anchor="middle" font-size="13" font-weight="bold">a (+)</text>

  <!-- R2 (horizontal, a to nc) -->
  <line class="wire" x1="330" y1="100" x2="370" y2="100"/>
  <line class="wire" x1="370" y1="100" x2="385" y2="100"/>
  <polyline class="wire" points="385,100 392,88 406,112 420,88 434,112 448,88 462,100"/>
  <line class="wire" x1="462" y1="100" x2="510" y2="100"/>
  <text id="slot-R2" class="label" x="423" y="82" text-anchor="middle">R2</text>

  <!-- nc node (top-right corner) -->
  <circle cx="510" cy="100" r="4" fill="black"/>
  <line class="wire" x1="510" y1="100" x2="630" y2="100"/>
  <line class="wire" x1="630" y1="100" x2="630" y2="138"/>

  <!-- V2 source (right side, vertical, opposing: + at top / nc side) -->
  <circle class="sym-filled" cx="630" cy="158" r="20"/>
  <!-- + at top (nc side) -->
  <line class="wire" x1="624" y1="140" x2="636" y2="146"/>
  <line class="wire" x1="624" y1="146" x2="636" y2="140"/>
  <!-- - at bottom -->
  <line class="wire" x1="624" y1="170" x2="636" y2="164"/>
  <line class="wire" x1="624" y1="164" x2="636" y2="170"/>
  <line class="wire" x1="630" y1="178" x2="630" y2="220"/>
  <text id="slot-V2" class="label" x="663" y="160" text-anchor="start">V2</text>

  <!-- R3 (vertical, right side, nd to ne) -->
  <line class="wire" x1="630" y1="220" x2="630" y2="238"/>
  <polyline class="wire" points="630,238 618,246 642,260 618,274 642,288 618,302 630,310"/>
  <line class="wire" x1="630" y1="310" x2="630" y2="320"/>
  <text id="slot-R3" class="label" x="655" y="278" text-anchor="start">R3</text>

  <!-- Bottom rail (right to left): ne - V3 - b - V4 - nf -->
  <line class="wire" x1="630" y1="320" x2="560" y2="320"/>

  <!-- V3 source (bottom, aiding return: + toward b / left side) -->
  <circle class="sym-filled" cx="530" cy="320" r="20"/>
  <!-- + at left (toward b) -->
  <line class="wire" x1="512" y1="314" x2="518" y2="326"/>
  <line class="wire" x1="512" y1="326" x2="518" y2="314"/>
  <!-- - at right (toward ne) -->
  <line class="wire" x1="542" y1="314" x2="548" y2="326"/>
  <line class="wire" x1="542" y1="326" x2="548" y2="314"/>
  <line class="wire" x1="510" y1="320" x2="470" y2="320"/>
  <text id="slot-V3" class="label" x="530" y="300" text-anchor="middle">V3</text>

  <!-- Terminal b (node dot + labels) -->
  <circle cx="470" cy="320" r="5" fill="black"/>
  <text x="470" y="348" text-anchor="middle" font-size="13" font-weight="bold">b (&#8722;)</text>

  <!-- V4 source (bottom, aiding: + toward nf / left side) -->
  <line class="wire" x1="470" y1="320" x2="430" y2="320"/>
  <circle class="sym-filled" cx="400" cy="320" r="20"/>
  <!-- + at left -->
  <line class="wire" x1="382" y1="314" x2="388" y2="326"/>
  <line class="wire" x1="382" y1="326" x2="388" y2="314"/>
  <!-- - at right (toward b) -->
  <line class="wire" x1="412" y1="314" x2="418" y2="326"/>
  <line class="wire" x1="412" y1="326" x2="418" y2="314"/>
  <line class="wire" x1="380" y1="320" x2="280" y2="320"/>
  <text id="slot-V4" class="label" x="400" y="300" text-anchor="middle">V4</text>

  <!-- nf node -->
  <circle cx="280" cy="320" r="4" fill="black"/>
  <line class="wire" x1="280" y1="320" x2="200" y2="320"/>

  <!-- R4 (vertical, left side, nf up to shared ground rail) -->
  <line class="wire" x1="200" y1="320" x2="200" y2="310"/>
  <polyline class="wire" points="200,310 188,302 212,288 188,274 212,260 188,246 200,238"/>
  <line class="wire" x1="200" y1="238" x2="200" y2="210"/>
  <text id="slot-R4" class="label" x="225" y="278" text-anchor="start">R4</text>

  <!-- Ground: connects V1- (at 140,320) and R4 bottom (at 200,210) via horizontal rail -->
  <line class="wire" x1="140" y1="320" x2="200" y2="320"/>
  <line class="wire" x1="200" y1="210" x2="200" y2="195"/>
  <line class="wire" x1="140" y1="320" x2="140" y2="370"/>
  <line class="wire" x1="200" y1="195" x2="200" y2="370"/>
  <line class="wire" x1="140" y1="370" x2="200" y2="370"/>

  <!-- Ground symbol at bottom centre of left rail -->
  <line class="wire" x1="170" y1="370" x2="170" y2="376"/>
  <line class="wire" x1="152" y1="376" x2="188" y2="376"/>
  <line class="wire" x1="158" y1="384" x2="182" y2="384"/>
  <line class="wire" x1="164" y1="392" x2="176" y2="392"/>

  <!-- Vab annotation -->
  <line stroke="#aaa" stroke-width="1" stroke-dasharray="4,3" x1="330" y1="115" x2="330" y2="305"/>
  <line stroke="#aaa" stroke-width="1" stroke-dasharray="4,3" x1="470" y1="305" x2="470" y2="335"/>
  <text x="400" y="225" text-anchor="middle" font-size="15" fill="#555">V<tspan font-size="11" baseline-shift="sub">ab</tspan></text>
</svg>
