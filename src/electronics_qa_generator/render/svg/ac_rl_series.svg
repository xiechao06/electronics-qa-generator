<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <style>
    text { font-family: sans-serif; font-size: 16px; fill: black; }
    .label { font-size: 14px; }
    .node { font-size: 12px; fill: #333; }
    .wire { stroke: black; stroke-width: 2; fill: none; }
    .sym-filled { stroke: black; stroke-width: 2; fill: white; }
    .thin { stroke: black; stroke-width: 1; fill: none; }
  </style>
  <rect width="800" height="400" fill="white"/>
  <text x="400" y="28" text-anchor="middle" font-size="18" font-weight="bold">Series RL — AC Phasor</text>

  <!-- Top rail -->
  <line class="wire" x1="180" y1="120" x2="340" y2="120"/>
  <line class="wire" x1="420" y1="120" x2="580" y2="120"/>
  <!-- Bottom rail -->
  <line class="wire" x1="180" y1="280" x2="580" y2="280"/>
  <!-- Ground -->
  <line class="wire" x1="180" y1="210" x2="180" y2="280"/>
  <line class="wire" x1="150" y1="280" x2="210" y2="280"/>
  <line class="wire" x1="158" y1="288" x2="202" y2="288"/>
  <line class="wire" x1="166" y1="296" x2="194" y2="296"/>

  <!-- Vin source (AC) -->
  <line class="wire" x1="180" y1="120" x2="180" y2="170"/>
  <circle class="sym-filled" cx="180" cy="190" r="20"/>
  <line class="thin" x1="174" y1="180" x2="186" y2="180"/>
  <line class="thin" x1="180" y1="174" x2="180" y2="186"/>
  <line class="thin" x1="174" y1="200" x2="186" y2="200"/>
  <text id="slot-Vin" class="label" x="196" y="192" text-anchor="start">Vin AC</text>
  <text class="node" x="144" y="125" text-anchor="end">in</text>

  <!-- R1 (horizontal) -->
  <line class="wire" x1="340" y1="120" x2="355" y2="120"/>
  <polyline class="wire" points="355,120 362,108 376,132 390,108 404,120"/>
  <line class="wire" x1="404" y1="120" x2="420" y2="120"/>
  <text id="slot-R1" class="label" x="380" y="103" text-anchor="middle">R1</text>

  <!-- nrl node (between R1 and L1) -->
  <circle cx="580" cy="120" r="5" fill="black"/>
  <text id="slot-node-nrl" class="node" x="580" y="105" text-anchor="middle">nrl</text>

  <!-- L1 (vertical inductor: nrl to gnd) -->
  <line class="wire" x1="580" y1="120" x2="580" y2="148"/>
  <!-- Inductor coils -->
  <path class="wire" d="M580,148 Q566,148 566,162 Q566,176 580,176 Q594,176 594,162 Q594,148 580,148" fill="none"/>
  <path class="wire" d="M580,176 Q566,176 566,190 Q566,204 580,204 Q594,204 594,190 Q594,176 580,176" fill="none"/>
  <path class="wire" d="M580,204 Q566,204 566,218 Q566,232 580,232 Q594,232 594,218 Q594,204 580,204" fill="none"/>
  <line class="wire" x1="580" y1="232" x2="580" y2="280"/>
  <text id="slot-L1" class="label" x="600" y="195" text-anchor="start">L1</text>

  <!-- VL measurement annotation (right side) -->
  <line stroke="#aaa" stroke-width="1" stroke-dasharray="4,3" x1="650" y1="125" x2="650" y2="275"/>
  <text class="label" x="665" y="165" text-anchor="start">+</text>
  <text class="label" x="663" y="205" text-anchor="start">V<tspan font-size="11" dy="3">L</tspan></text>
  <text class="label" x="665" y="275" text-anchor="start">&#8722;</text>
</svg>
