<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <style>
    text { font-family: sans-serif; font-size: 16px; fill: black; }
    .label { font-size: 14px; }
    .node { font-size: 12px; fill: #333; }
    .wire { stroke: black; stroke-width: 2; fill: none; }
    .sym { stroke: black; stroke-width: 2; fill: none; }
    .sym-filled { stroke: black; stroke-width: 2; fill: white; }
  </style>

  <rect width="800" height="400" fill="white"/>
  <text x="400" y="30" text-anchor="middle" font-size="18" font-weight="bold">Series RLC Resonance</text>

  <!-- Top rail -->
  <line class="wire" x1="180" y1="120" x2="280" y2="120"/>
  <line class="wire" x1="360" y1="120" x2="440" y2="120"/>
  <line class="wire" x1="520" y1="120" x2="620" y2="120"/>
  <!-- Bottom rail -->
  <line class="wire" x1="180" y1="280" x2="620" y2="280"/>
  <!-- Vin wire -->
  <line class="wire" x1="180" y1="120" x2="180" y2="170"/>

  <!-- Vin (AC) -->
  <circle class="sym-filled" cx="180" cy="190" r="20"/>
  <line class="wire" x1="180" y1="170" x2="180" y2="175"/>
  <line class="wire" x1="180" y1="205" x2="180" y2="210"/>
  <line class="wire" x1="174" y1="172" x2="186" y2="178"/>
  <line class="wire" x1="174" y1="178" x2="186" y2="172"/>
  <line class="wire" x1="174" y1="208" x2="186" y2="202"/>
  <line class="wire" x1="174" y1="202" x2="186" y2="208"/>
  <text id="slot-Vin" class="label" x="195" y="192" text-anchor="start">Vin 1V AC</text>

  <!-- R1 (horizontal resistor) -->
  <line class="wire" x1="280" y1="120" x2="295" y2="120"/>
  <line class="wire" x1="345" y1="120" x2="360" y2="120"/>
  <polyline class="wire" points="295,120 305,110 315,130 325,110 335,130 345,120"/>
  <text id="slot-R1" class="label" x="320" y="105" text-anchor="middle">R1 10Ω</text>

  <!-- L1 (horizontal inductor) -->
  <line class="wire" x1="440" y1="120" x2="458" y2="120"/>
  <line class="wire" x1="502" y1="120" x2="520" y2="120"/>
  <path class="sym" d="M 458 120 Q 462 110, 466 120 Q 470 130, 474 120 Q 478 110, 482 120 Q 486 130, 490 120 Q 494 110, 498 120 Q 502 130, 502 120"/>
  <text id="slot-L1" class="label" x="480" y="105" text-anchor="middle">L1 10mH</text>

  <!-- C1 (vertical capacitor) -->
  <line class="wire" x1="620" y1="120" x2="620" y2="150"/>
  <line class="wire" x1="605" y1="150" x2="635" y2="150"/>
  <line class="wire" x1="605" y1="160" x2="635" y2="160"/>
  <line class="wire" x1="608" y1="148" x2="608" y2="162" stroke-width="1"/>
  <line class="wire" x1="632" y1="148" x2="632" y2="162" stroke-width="1"/>
  <line class="wire" x1="620" y1="160" x2="620" y2="280"/>
  <text id="slot-C1" class="label" x="638" y="210" text-anchor="start">C1 100nF</text>

  <!-- Ground -->
  <line class="wire" x1="180" y1="210" x2="180" y2="280"/>
  <line class="wire" x1="150" y1="280" x2="210" y2="280"/>
  <line class="wire" x1="158" y1="288" x2="202" y2="288"/>
  <line class="wire" x1="166" y1="296" x2="194" y2="296"/>

  <text id="slot-node-in" class="node" x="140" y="125" text-anchor="end">in</text>
  <text id="slot-node-mid" class="node" x="400" y="115" text-anchor="middle">mid</text>
</svg>
