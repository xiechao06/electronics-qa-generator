<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <style>
    text { font-family: sans-serif; font-size: 16px; fill: black; }
    .label { font-size: 14px; }
    .node { font-size: 12px; fill: #333; }
    .wire { stroke: black; stroke-width: 2; fill: none; }
    .sym { stroke: black; stroke-width: 2; fill: none; }
    .sym-filled { stroke: black; stroke-width: 2; fill: white; }
    .thin { stroke: black; stroke-width: 1; fill: none; }
  </style>

  <rect width="800" height="400" fill="white"/>
  <text x="400" y="30" text-anchor="middle" font-size="18" font-weight="bold">BJT Emitter Follower</text>

  <!-- VCC rail -->
  <line class="wire" x1="90" y1="70" x2="460" y2="70"/>
  <!-- Ground rail -->
  <line class="wire" x1="60" y1="360" x2="640" y2="360"/>
  <!-- Ground symbol -->
  <line class="wire" x1="120" y1="360" x2="120" y2="366"/>
  <line class="wire" x1="100" y1="366" x2="140" y2="366"/>
  <line class="wire" x1="108" y1="372" x2="132" y2="372"/>
  <line class="wire" x1="116" y1="378" x2="124" y2="378"/>

  <!-- VCC supply source -->
  <circle class="sym-filled" cx="90" cy="150" r="16"/>
  <line class="thin" x1="85" y1="140" x2="95" y2="140"/>
  <line class="thin" x1="90" y1="135" x2="90" y2="145"/>
  <line class="thin" x1="85" y1="160" x2="95" y2="160"/>
  <line class="wire" x1="90" y1="134" x2="90" y2="70"/>
  <line class="wire" x1="90" y1="166" x2="90" y2="360"/>
  <text id="slot-VCC" class="label" x="68" y="153" text-anchor="end">VCC V</text>

  <!-- Vin AC source -->
  <circle class="sym-filled" cx="200" cy="320" r="18"/>
  <line class="thin" x1="194" y1="310" x2="206" y2="310"/>
  <line class="thin" x1="200" y1="304" x2="200" y2="316"/>
  <line class="thin" x1="194" y1="330" x2="206" y2="330"/>
  <line class="wire" x1="200" y1="302" x2="200" y2="210"/>
  <line class="wire" x1="200" y1="338" x2="200" y2="360"/>
  <text id="slot-Vin" class="label" x="222" y="324" text-anchor="start">Vin 1V AC</text>
  <text id="slot-node-in" class="node" x="220" y="202" text-anchor="middle">in</text>

  <!-- Cin coupling cap -->
  <line class="wire" x1="200" y1="210" x2="246" y2="210"/>
  <line class="wire" x1="246" y1="198" x2="246" y2="222"/>
  <line class="wire" x1="254" y1="198" x2="254" y2="222"/>
  <line class="wire" x1="254" y1="210" x2="340" y2="210"/>
  <text class="label" x="250" y="244" text-anchor="middle" font-size="12">Cin</text>

  <!-- R1 (VCC -> base) -->
  <line class="wire" x1="340" y1="70" x2="340" y2="110"/>
  <polyline class="wire" points="340,110 330,116 350,128 330,140 350,152 340,158"/>
  <line class="wire" x1="340" y1="158" x2="340" y2="210"/>
  <text id="slot-R1" class="label" x="358" y="138" text-anchor="start">R1</text>

  <!-- R2 (base -> ground) -->
  <line class="wire" x1="340" y1="210" x2="340" y2="250"/>
  <polyline class="wire" points="340,250 330,256 350,268 330,280 350,292 340,298"/>
  <line class="wire" x1="340" y1="298" x2="340" y2="360"/>
  <text id="slot-R2" class="label" x="358" y="278" text-anchor="start">R2</text>

  <!-- Base lead -->
  <line class="wire" x1="340" y1="210" x2="420" y2="210"/>
  <text id="slot-Q1" class="label" x="408" y="248" text-anchor="end">Q1</text>

  <!-- BJT NPN symbol -->
  <line class="wire" x1="420" y1="188" x2="420" y2="232"/>
  <line class="wire" x1="420" y1="198" x2="460" y2="172"/>
  <line class="wire" x1="420" y1="222" x2="460" y2="250"/>
  <!-- emitter arrow (outward, NPN) -->
  <polygon points="460,250 446,244 451,236" fill="black"/>

  <!-- Collector tied to VCC -->
  <line class="wire" x1="460" y1="172" x2="460" y2="70"/>

  <!-- RE (emitter -> ground) -->
  <line class="wire" x1="460" y1="250" x2="460" y2="282"/>
  <polyline class="wire" points="460,282 450,288 470,300 450,312 470,324 460,330"/>
  <line class="wire" x1="460" y1="330" x2="460" y2="360"/>
  <text id="slot-RE" class="label" x="478" y="310" text-anchor="start">RE</text>

  <!-- Emitter node + Cout to output -->
  <line class="wire" x1="460" y1="266" x2="540" y2="266"/>
  <line class="wire" x1="540" y1="254" x2="540" y2="278"/>
  <line class="wire" x1="548" y1="254" x2="548" y2="278"/>
  <line class="wire" x1="548" y1="266" x2="640" y2="266"/>
  <text class="label" x="544" y="298" text-anchor="middle" font-size="12">Cout</text>
  <text id="slot-node-out" class="node" x="612" y="257" text-anchor="start">out</text>

  <!-- Rload (out -> ground) -->
  <line class="wire" x1="600" y1="266" x2="600" y2="290"/>
  <polyline class="wire" points="600,290 590,296 610,308 590,320 610,332 600,338"/>
  <line class="wire" x1="600" y1="338" x2="600" y2="360"/>
  <text id="slot-Rload" class="label" x="618" y="318" text-anchor="start">Rload</text>
</svg>
