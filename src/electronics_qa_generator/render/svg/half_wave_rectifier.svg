<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <style>
    text { font-family: sans-serif; font-size: 16px; fill: black; }
    .label { font-size: 14px; }
    .node { font-size: 12px; fill: #333; }
    .wire { stroke: black; stroke-width: 2; fill: none; }
    .sym { stroke: black; stroke-width: 2; fill: none; }
    .sym-filled { stroke: black; stroke-width: 2; fill: white; }
  </style>

  <rect width="800" height="400" fill="white"/>

  <text x="400" y="30" text-anchor="middle" font-size="18" font-weight="bold">Half-Wave Rectifier</text>

  <!-- Top rail -->
  <line class="wire" x1="180" y1="120" x2="340" y2="120"/>
  <line class="wire" x1="420" y1="120" x2="580" y2="120"/>
  <!-- Bottom rail -->
  <line class="wire" x1="180" y1="280" x2="680" y2="280"/>
  <!-- Vertical Vin wire -->
  <line class="wire" x1="180" y1="120" x2="180" y2="190"/>

  <!-- Vin voltage source (vertical, sinusoidal) -->
  <circle class="sym-filled" cx="180" cy="190" r="20"/>
  <line class="wire" x1="180" y1="170" x2="180" y2="175"/>
  <line class="wire" x1="180" y1="205" x2="180" y2="210"/>
  <line class="wire" x1="174" y1="172" x2="186" y2="178"/>
  <line class="wire" x1="174" y1="178" x2="186" y2="172"/>
  <line class="wire" x1="174" y1="208" x2="186" y2="202"/>
  <line class="wire" x1="174" y1="202" x2="186" y2="208"/>
  <text id="slot-Vin" class="label" x="195" y="192" text-anchor="start">Vin 5V 60Hz</text>

  <!-- D1 (diode, horizontal on top rail) -->
  <line class="wire" x1="340" y1="120" x2="362" y2="120"/>
  <!-- Diode triangle pointing right -->
  <polygon class="sym" points="362,110 362,130 385,120"/>
  <!-- Bar (cathode) -->
  <line class="wire" x1="385" y1="110" x2="385" y2="130"/>
  <!-- Right lead -->
  <line class="wire" x1="385" y1="120" x2="420" y2="120"/>
  <text id="slot-D1" class="label" x="375" y="105" text-anchor="middle">D1 1N4148</text>

  <!-- C1 (capacitor, vertical from out to bottom rail) -->
  <!-- Vertical wire from out to capacitor top -->
  <line class="wire" x1="580" y1="120" x2="580" y2="160"/>
  <!-- Capacitor plates (horizontal) -->
  <line class="wire" x1="565" y1="160" x2="595" y2="160"/>
  <line class="wire" x1="565" y1="170" x2="595" y2="170"/>
  <line class="wire" x1="568" y1="158" x2="568" y2="172" stroke-width="1"/>
  <line class="wire" x1="592" y1="158" x2="592" y2="172" stroke-width="1"/>
  <!-- Bottom lead to ground -->
  <line class="wire" x1="580" y1="170" x2="580" y2="280"/>
  <text id="slot-C1" class="label" x="598" y="210" text-anchor="start">C1 47μF</text>

  <!-- Rload (zigzag resistor, vertical from out to bottom rail — parallel with C1) -->
  <!-- Vertical wire from out area to resistor top -->
  <line class="wire" x1="680" y1="120" x2="680" y2="160"/>
  <!-- Top rail for Rload connects to out -->
  <line class="wire" x1="580" y1="120" x2="680" y2="120"/>
  <!-- Zigzag vertical -->
  <polyline class="wire" points="680,160 665,175 695,195 665,215 695,235 680,250"/>
  <!-- Bottom lead to ground -->
  <line class="wire" x1="680" y1="250" x2="680" y2="280"/>
  <text id="slot-Rload" class="label" x="698" y="210" text-anchor="start">Rload 1kΩ</text>

  <!-- Ground -->
  <line class="wire" x1="180" y1="220" x2="180" y2="280"/>
  <line class="wire" x1="150" y1="280" x2="210" y2="280"/>
  <line class="wire" x1="158" y1="288" x2="202" y2="288"/>
  <line class="wire" x1="166" y1="296" x2="194" y2="296"/>

  <!-- Node labels -->
  <text id="slot-node-in" class="node" x="140" y="125" text-anchor="end">in</text>
  <text id="slot-node-out" class="node" x="500" y="115" text-anchor="middle">out</text>
</svg>
