<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440">
  <style>
    text { font-family: sans-serif; font-size: 16px; fill: black; }
    .label { font-size: 14px; }
    .node { font-size: 12px; fill: #333; }
    .wire { stroke: black; stroke-width: 2; fill: none; }
    .sym-filled { stroke: black; stroke-width: 2; fill: white; }
    .thin { stroke: black; stroke-width: 1; fill: none; }
  </style>
  <rect width="800" height="440" fill="white"/>
  <text x="400" y="28" text-anchor="middle" font-size="18" font-weight="bold">Difference Amplifier</text>

  <!-- Ground rail -->
  <line class="wire" x1="60" y1="380" x2="700" y2="380"/>
  <line class="wire" x1="150" y1="380" x2="150" y2="386"/>
  <line class="wire" x1="132" y1="386" x2="168" y2="386"/>
  <line class="wire" x1="138" y1="393" x2="162" y2="393"/>
  <line class="wire" x1="144" y1="400" x2="156" y2="400"/>

  <!-- Va source (top) -->
  <line class="wire" x1="100" y1="160" x2="100" y2="122"/>
  <circle class="sym-filled" cx="100" cy="142" r="20"/>
  <line class="thin" x1="94" y1="132" x2="106" y2="132"/>
  <line class="thin" x1="100" y1="126" x2="100" y2="138"/>
  <line class="thin" x1="94" y1="152" x2="106" y2="152"/>
  <line class="wire" x1="100" y1="162" x2="100" y2="380"/>
  <text id="slot-Va" class="label" x="58" y="144" text-anchor="end">Va</text>
  <text class="node" x="86" y="158" text-anchor="end">ina</text>

  <!-- Vb source (bottom) -->
  <line class="wire" x1="100" y1="290" x2="100" y2="252"/>
  <circle class="sym-filled" cx="100" cy="272" r="20"/>
  <line class="thin" x1="94" y1="262" x2="106" y2="262"/>
  <line class="thin" x1="100" y1="256" x2="100" y2="268"/>
  <line class="thin" x1="94" y1="282" x2="106" y2="282"/>
  <line class="wire" x1="100" y1="292" x2="100" y2="380"/>
  <text id="slot-Vb" class="label" x="58" y="274" text-anchor="end">Vb</text>
  <text class="node" x="86" y="290" text-anchor="end">inb</text>

  <!-- Ra: ina -> minus(-) -->
  <line class="wire" x1="100" y1="160" x2="145" y2="160"/>
  <polyline class="wire" points="145,160 152,148 166,172 180,148 194,172 208,160"/>
  <line class="wire" x1="208" y1="160" x2="420" y2="160"/>
  <text id="slot-Ra" class="label" x="176" y="143" text-anchor="middle">Ra</text>

  <!-- Rb: inb -> nplus(+) -->
  <line class="wire" x1="100" y1="290" x2="145" y2="290"/>
  <polyline class="wire" points="145,290 152,278 166,302 180,278 194,302 208,290"/>
  <line class="wire" x1="208" y1="290" x2="380" y2="290"/>
  <text id="slot-Rb" class="label" x="176" y="273" text-anchor="middle">Rb</text>

  <!-- Rc: nplus -> gnd -->
  <line class="wire" x1="380" y1="290" x2="420" y2="290"/>
  <circle cx="380" cy="290" r="4" fill="black"/>
  <line class="wire" x1="380" y1="290" x2="380" y2="315"/>
  <polyline class="wire" points="380,315 368,323 392,337 368,351 392,365 380,373"/>
  <line class="wire" x1="380" y1="373" x2="380" y2="380"/>
  <text id="slot-Rc" class="label" x="404" y="348" text-anchor="start">Rc</text>

  <!-- Op-amp: (+)=nplus, (-)=minus -->
  <line class="wire" x1="420" y1="290" x2="460" y2="290"/>
  <polygon class="sym-filled" points="460,225 460,315 560,270"/>
  <text x="476" y="255" text-anchor="middle" font-size="14">&#8722;</text>
  <text x="476" y="295" text-anchor="middle" font-size="16">+</text>
  <line class="wire" x1="420" y1="160" x2="460" y2="160"/>
  <line class="wire" x1="460" y1="160" x2="460" y2="252"/>

  <!-- Rf: out -> minus (top feedback) -->
  <line class="wire" x1="560" y1="270" x2="640" y2="270"/>
  <circle cx="600" cy="270" r="5" fill="black"/>
  <line class="wire" x1="600" y1="270" x2="600" y2="100"/>
  <line class="wire" x1="600" y1="100" x2="440" y2="100"/>
  <line class="wire" x1="440" y1="100" x2="440" y2="160"/>
  <polyline class="wire" points="490,100 497,88 511,112 525,88 539,112 553,100"/>
  <text id="slot-Rf" class="label" x="521" y="84" text-anchor="middle">Rf</text>

  <!-- Output to gnd -->
  <line class="wire" x1="640" y1="270" x2="640" y2="380"/>
  <text class="node" x="655" y="262" text-anchor="start">out</text>
  <text id="slot-node-out" class="node" x="655" y="278" text-anchor="start">V&#8320;</text>
</svg>
