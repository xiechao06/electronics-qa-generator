<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <style>
    text { font-family: sans-serif; font-size: 16px; fill: black; }
    .label { font-size: 14px; }
    .node { font-size: 11px; fill: #333; }
    .wire { stroke: black; stroke-width: 2; fill: none; }
    .sym { stroke: black; stroke-width: 2; fill: none; }
    .sym-filled { stroke: black; stroke-width: 2; fill: white; }
  </style>

  <rect width="800" height="400" fill="white"/>

  <text x="400" y="30" text-anchor="middle" font-size="18" font-weight="bold">RLC Band-Pass Filter</text>

  <!-- Top rail -->
  <line class="wire" x1="180" y1="120" x2="280" y2="120"/>
  <!-- Gap for L1 inductor, then top rail continues -->
  <line class="wire" x1="360" y1="120" x2="420" y2="120"/>
  <!-- Gap for C1 capacitor, then top rail continues -->
  <line class="wire" x1="520" y1="120" x2="620" y2="120"/>
  <!-- Bottom rail -->
  <line class="wire" x1="180" y1="280" x2="620" y2="280"/>
  <!-- Vertical Vin wire (stops at circle top) -->
  <line class="wire" x1="180" y1="120" x2="180" y2="170"/>

  <!-- Vin voltage source (vertical, AC) -->
  <circle class="sym-filled" cx="180" cy="190" r="20"/>
  <line class="wire" x1="180" y1="170" x2="180" y2="175"/>
  <line class="wire" x1="180" y1="205" x2="180" y2="210"/>
  <line class="wire" x1="174" y1="172" x2="186" y2="178"/>
  <line class="wire" x1="174" y1="178" x2="186" y2="172"/>
  <line class="wire" x1="174" y1="208" x2="186" y2="202"/>
  <line class="wire" x1="174" y1="202" x2="186" y2="208"/>
  <text id="slot-Vin" class="label" x="195" y="192" text-anchor="start">Vin 1V AC</text>

  <!-- L1 (horizontal inductor on top rail) -->
  <line class="wire" x1="280" y1="120" x2="298" y2="120"/>
  <line class="wire" x1="342" y1="120" x2="360" y2="120"/>
  <path class="sym" d="M 298 120 Q 302 110, 306 120 Q 310 130, 314 120 Q 318 110, 322 120 Q 326 130, 330 120 Q 334 110, 338 120 Q 342 130, 342 120"/>
  <text id="slot-L1" class="label" x="320" y="105" text-anchor="middle">L1 10mH</text>

  <!-- C1 (horizontal capacitor on top rail) -->
  <!-- Left lead (touches plate 1) -->
  <line class="wire" x1="420" y1="120" x2="440" y2="120"/>
  <!-- Capacitor plates -->
  <line class="wire" x1="440" y1="108" x2="440" y2="132"/>
  <line class="wire" x1="452" y1="108" x2="452" y2="132"/>
  <!-- Right lead (touches plate 2) -->
  <line class="wire" x1="452" y1="120" x2="520" y2="120"/>
  <text id="slot-C1" class="label" x="478" y="105" text-anchor="middle">C1 1μF</text>

  <!-- R1 (vertical resistor, dropping to bottom rail) -->
  <line class="wire" x1="620" y1="120" x2="620" y2="145"/>
  <polyline class="wire" points="620,145 605,160 635,180 605,200 635,220 620,235"/>
  <line class="wire" x1="620" y1="235" x2="620" y2="280"/>
  <text id="slot-R1" class="label" x="638" y="190" text-anchor="start">R1 47Ω</text>

  <!-- Ground (wire connects from circle bottom) -->
  <line class="wire" x1="180" y1="210" x2="180" y2="280"/>
  <line class="wire" x1="150" y1="280" x2="210" y2="280"/>
  <line class="wire" x1="158" y1="288" x2="202" y2="288"/>
  <line class="wire" x1="166" y1="296" x2="194" y2="296"/>

  <!-- Node labels -->
  <text id="slot-node-in" class="node" x="140" y="125" text-anchor="end">in</text>
  <text id="slot-node-mid" class="node" x="400" y="115" text-anchor="middle">mid</text>
  <text id="slot-node-out" class="node" x="570" y="115" text-anchor="middle">out</text>
</svg>
